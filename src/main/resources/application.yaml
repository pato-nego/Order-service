spring:
  application:
    name: order

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: orders

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: orders

  web:
    error:
      include-message: always

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

store:
  product:
    url: ${PRODUCT_URL:http://product:8080}
  exchange:
    url: ${EXCHANGE_URL:http://exchange:8000}
